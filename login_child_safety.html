<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="stylesheet" href="./ui-polish.css"/>
    <title>RAYDAR — Child Safety Authentication</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#532ce6",
              "primary-hover": "#4320d0",
              "primary-container": "#6c4dff",
              "on-primary": "#ffffff",
              surface: "#F4F6FB",
              "surface-card": "#ffffff",
              "on-surface": "#1A1C28",
              "on-surface-variant": "#64748B",
              outline: "#E2E8F0",
              "outline-focus": "#532CE6",
              "error-container": "#FEE2E2",
              "on-error-container": "#991B1B",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
              body: ["Inter", "sans-serif"],
            }
          }
        }
      }
    </script>
    <style>
        body {
            background-color: #F4F6FB;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(83, 44, 230, 0.06) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-card {
            background: #ffffff;
            box-shadow: 0 16px 40px -8px rgba(26, 28, 40, 0.07), 0 2px 8px -2px rgba(26, 28, 40, 0.03);
            border: 1px solid #EAEFF6;
        }
        .app-icon-squircle {
            background: linear-gradient(145deg, #6C4DFF 0%, #4B24D9 100%);
            box-shadow: 0 10px 24px -4px rgba(83, 44, 230, 0.35);
        }
        .input-field {
            background-color: #FAFCFE;
            border: 1px solid #E2E8F0;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-field:focus-within {
            background-color: #ffffff;
            border-color: #532CE6;
            box-shadow: 0 0 0 3px rgba(83, 44, 230, 0.12);
        }
    </style>
</head>
<body class="font-body text-[#1A1C28] antialiased min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Centered Authentication Card (Visual language faithfully aligned with reference) -->
    <main class="w-full max-w-[390px] auth-card rounded-[28px] sm:rounded-[32px] p-6 sm:p-8 flex flex-col my-auto transition-all">
        
        <!-- Header & App Logo Icon -->
        <header class="flex flex-col items-center text-center mb-6">
            <!-- App Logo Squircle Icon with subtle depth -->
            <div class="w-14 h-14 sm:w-16 sm:h-16 app-icon-squircle rounded-[20px] sm:rounded-[22px] flex items-center justify-center mb-4 transition-transform hover:scale-105" aria-hidden="true">
                <!-- RAYDAR Radar/Shield Child-Safety Icon -->
                <svg class="w-7 h-7 sm:w-8 sm:h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <circle cx="12" cy="11" r="3"/>
                    <path d="M12 8a3 3 0 0 1 3 3"/>
                </svg>
            </div>

            <!-- Heading & Subtitle -->
            <h1 class="font-display font-extrabold text-[24px] sm:text-[26px] text-[#1A1C28] tracking-tight leading-snug">
                Welcome Back
            </h1>
            <p class="text-[13px] sm:text-[14px] text-[#64748B] mt-1.5 leading-normal max-w-[280px]">
                Enter your credentials to access your RAYDAR child safety account.
            </p>
        </header>

        <!-- Form Elements -->
        <form id="loginForm" class="space-y-4" novalidate>
            
            <!-- Success Message Banner -->
            <div id="successMsg" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 px-3.5 py-2.5 rounded-xl text-[13px] flex items-center gap-2.5 animate-in fade-in">
                <span class="material-symbols-outlined text-[18px] text-emerald-600 shrink-0" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                <span id="successText" class="font-medium leading-snug">Compte créé avec succès ! Connectez-vous avec vos identifiants.</span>
            </div>

            <!-- Error Message Banner -->
            <div id="errorMsg" class="hidden bg-error-container border border-red-200 text-on-error-container px-3.5 py-2.5 rounded-xl text-[13px] flex items-center gap-2.5 animate-in fade-in">
                <span class="material-symbols-outlined text-[18px] text-red-600 shrink-0">error</span>
                <span id="errorText" class="font-medium leading-snug"></span>
            </div>

            <!-- Email Field -->
            <div class="space-y-1.5">
                <div class="relative flex items-center input-field rounded-2xl h-[48px] sm:h-[50px] px-3.5">
                    <span class="material-symbols-outlined text-[#94A3B8] text-[20px] mr-2.5 select-none pointer-events-none" aria-hidden="true">mail</span>
                    <input 
                        class="w-full bg-transparent border-0 p-0 text-[14px] sm:text-[15px] text-[#1A1C28] placeholder-[#94A3B8] focus:ring-0 focus:outline-none" 
                        id="email" 
                        name="email" 
                        placeholder="name@example.com" 
                        type="email" 
                        required 
                        autocomplete="email"
                        aria-label="Email address"
                    />
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-1.5">
                <div class="relative flex items-center input-field rounded-2xl h-[48px] sm:h-[50px] px-3.5">
                    <span class="material-symbols-outlined text-[#94A3B8] text-[20px] mr-2.5 select-none pointer-events-none" aria-hidden="true">lock</span>
                    <input 
                        class="w-full bg-transparent border-0 p-0 pr-8 text-[14px] sm:text-[15px] text-[#1A1C28] placeholder-[#94A3B8] focus:ring-0 focus:outline-none" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        type="password" 
                        required 
                        autocomplete="current-password"
                        aria-label="Password"
                    />
                    <button id="togglePasswordBtn" class="absolute right-3 text-[#94A3B8] hover:text-[#532CE6] transition-colors p-1" type="button" aria-label="Toggle password visibility">
                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <!-- Remember me & Forgot password Row -->
            <div class="flex items-center justify-between pt-0.5 pb-1 text-[13px]">
                <label class="flex items-center cursor-pointer select-none text-[#64748B] hover:text-[#1A1C28] transition-colors">
                    <input id="rememberMe" type="checkbox" class="w-4 h-4 rounded text-[#532CE6] border-[#CBD5E1] focus:ring-[#532CE6]/20 cursor-pointer"/>
                    <span class="ml-2 text-[#64748B]">Remember me</span>
                </label>
                <a class="text-[#532CE6] font-medium hover:underline text-[13px]" href="./forgot_password.html">
                    Forgot password?
                </a>
            </div>

            <!-- Primary Sign In Button -->
            <button 
                id="submitBtn" 
                class="w-full h-[48px] sm:h-[50px] bg-[#532CE6] hover:bg-[#4320D0] active:scale-[0.98] text-white font-semibold text-[15px] rounded-full sm:rounded-2xl shadow-[0_4px_16px_rgba(83,44,230,0.25)] hover:shadow-[0_6px_20px_rgba(83,44,230,0.35)] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer" 
                type="submit"
            >
                <span id="btnText">Sign In</span>
                <span id="btnIcon" class="hidden material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>

        <!-- OR Divider with pill badge -->
        <div class="relative flex items-center justify-center my-5">
            <div class="w-full border-t border-[#E8ECF4]"></div>
            <span class="absolute bg-white px-2.5 py-0.5 rounded-full text-[10px] sm:text-[11px] font-semibold text-[#94A3B8] uppercase tracking-wider border border-[#F1F4F9]">
                OR
            </span>
        </div>

        <!-- Continue with Google Button -->
        <div class="flex flex-col">
            <button 
                id="googleBtn" 
                class="flex items-center justify-center h-[48px] sm:h-[50px] w-full bg-white border border-[#E2E8F0] rounded-full sm:rounded-2xl text-[#1A1C28] text-[14px] sm:text-[15px] font-medium hover:bg-[#F8FAFC] hover:border-[#CBD5E1] active:scale-[0.98] transition-all duration-200 shadow-[0_1px_3px_rgba(0,0,0,0.02)] cursor-pointer gap-3" 
                type="button"
            >
                <!-- Official Google Colored G Icon -->
                <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <!-- Footer Links: Sign Up & Guest -->
        <footer class="mt-6 text-center space-y-2">
            <p class="text-[13px] text-[#64748B]">
                Don't have an account? 
                <a class="text-[#532CE6] font-semibold hover:underline ml-1 inline-block" href="./sign_up_child_safety.html">
                    Sign up
                </a>
            </p>
            <p class="text-[12px] text-[#94A3B8]">
                <a class="hover:text-[#532CE6] transition-colors hover:underline" href="./home_child_safety_v1.html" onclick="localStorage.setItem('is_guest', 'true'); sessionStorage.setItem('childSafetyAccountType', 'Guest');">
                    Continue as guest
                </a>
            </p>
        </footer>
    </main>

    <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
    </script>
    <script type="module">
        import { supabase } from "./src/supabaseClient.js";
        import { signInWithGoogle, protectRoute } from "./src/authService.js";

        // If the user arrived via OAuth callback with access token or auth code, resolve login immediately
        const isOAuthCallback = window.location.hash.includes('access_token') || window.location.search.includes('code=');
        if (isOAuthCallback) {
            sessionStorage.setItem('raydar_in_app_session', 'true');
            await protectRoute('login');
        }

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');
        const successText = document.getElementById('successText');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeInput = document.getElementById('rememberMe');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const googleBtn = document.getElementById('googleBtn');
        const passToggleBtn = document.getElementById('togglePasswordBtn');

        // Toggle Password Visibility
        if (passToggleBtn && passwordInput) {
            passToggleBtn.addEventListener('click', () => {
                const icon = passToggleBtn.querySelector('.material-symbols-outlined');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    if (icon) icon.textContent = 'visibility_off';
                } else {
                    passwordInput.type = 'password';
                    if (icon) icon.textContent = 'visibility';
                }
            });
        }

        // Restore saved email if remember me was active
        try {
            const savedRememberEmail = localStorage.getItem('raydar_remember_email');
            if (savedRememberEmail && emailInput && !emailInput.value) {
                emailInput.value = savedRememberEmail;
                if (rememberMeInput) rememberMeInput.checked = true;
            }
        } catch (e) {}

        // Check for signup redirect or prefilled email
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const isRegistered = urlParams.get('registered') === 'true';
            const emailParam = urlParams.get('email') || sessionStorage.getItem('signup_success_email');
            const customSuccessMsg = sessionStorage.getItem('signup_success_message');

            if (emailParam && emailInput) {
                emailInput.value = decodeURIComponent(emailParam);
            }

            if (isRegistered || emailParam || customSuccessMsg) {
                const msg = customSuccessMsg || "Compte créé avec succès ! Connectez-vous avec vos identifiants.";
                showSuccess(msg);

                // Auto-focus password input if email is prefilled
                if (emailInput && emailInput.value && passwordInput) {
                    setTimeout(() => {
                        passwordInput.focus();
                    }, 200);
                }

                // Clean up sessionStorage and URL parameters without reloading
                sessionStorage.removeItem('signup_success_email');
                sessionStorage.removeItem('signup_success_message');
                if (window.history && window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        } catch (e) {
            console.warn("Notice checking registration redirect:", e);
        }

        if (googleBtn) {
            googleBtn.addEventListener('click', async () => {
                if (errorMsg) errorMsg.classList.add('hidden');
                if (errorText) errorText.textContent = '';
                if (successMsg) successMsg.classList.add('hidden');
                
                try {
                    googleBtn.disabled = true;
                    googleBtn.classList.add('opacity-75', 'cursor-wait');
                    console.log("Initiating Google Sign-In with select_account prompt...");
                    await signInWithGoogle();
                } catch (err) {
                    console.error("Google login error:", err);
                    googleBtn.disabled = false;
                    googleBtn.classList.remove('opacity-75', 'cursor-wait');
                    showError("Erreur lors de la connexion Google: " + (err.message || "Veuillez réessayer."));
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset state
            if (errorMsg) errorMsg.classList.add('hidden');
            if (errorText) errorText.textContent = '';
            if (successMsg) successMsg.classList.add('hidden');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email) {
                showError('Veuillez saisir votre adresse e-mail.');
                emailInput.focus();
                return;
            }
            if (!password) {
                showError('Veuillez saisir votre mot de passe.');
                passwordInput.focus();
                return;
            }

            // Save or clear remember me email
            try {
                if (rememberMeInput && rememberMeInput.checked) {
                    localStorage.setItem('raydar_remember_email', email);
                } else {
                    localStorage.removeItem('raydar_remember_email');
                }
            } catch (e) {}
            
            setLoading(true);
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    let msg = error.message || '';
                    if (msg.toLowerCase().includes('email not confirmed')) {
                        showError("Check your email and confirm your account before logging in.");
                    } else if (msg.toLowerCase().includes('invalid login credentials')) {
                        showError("Adresse e-mail ou mot de passe incorrect. Veuillez vérifier vos identifiants.");
                    } else {
                        showError("Ce compte n'existe pas ou le mot de passe est incorrect. Veuillez vérifier vos identifiants ou créer un compte.");
                    }
                    setLoading(false);
                    return;
                }

                // Only redirect when a real session exists after login
                let session = data?.session;
                if (!session) {
                    const { data: sessionData } = await supabase.auth.getSession();
                    session = sessionData?.session;
                }

                if (!session) {
                    console.warn("No active session found after login. Not redirecting.");
                    showError("Check your email and confirm your account before logging in.");
                    setLoading(false);
                    return;
                }
                
                console.log('Login successful! Real session confirmed for user:', session.user.id);
                localStorage.removeItem('is_guest');
                sessionStorage.setItem('raydar_in_app_session', 'true');
                sessionStorage.removeItem('signup_in_progress');
                await protectRoute('login');
            } catch (err) {
                console.error('Unexpected login error:', err);
                showError("Ce compte n'existe pas ou le mot de passe est incorrect. Veuillez vérifier vos identifiants ou créer un compte.");
                setLoading(false);
            }
        });

        function showSuccess(msg) {
            if (errorMsg) errorMsg.classList.add('hidden');
            if (successText) successText.textContent = msg;
            if (successMsg) {
                successMsg.classList.remove('hidden');
                successMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function showError(msg) {
            if (successMsg) successMsg.classList.add('hidden');
            errorText.textContent = msg;
            errorMsg.classList.remove('hidden');
            errorMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.textContent = 'Connexion...';
                if (btnIcon) {
                    btnIcon.textContent = 'pending';
                    btnIcon.classList.remove('hidden');
                    btnIcon.classList.add('animate-spin');
                }
            } else {
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                if (btnIcon) {
                    btnIcon.classList.add('hidden');
                    btnIcon.classList.remove('animate-spin');
                }
            }
        }
    </script>
</body>
</html>
