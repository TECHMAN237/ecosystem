<body class="bg-[#F8F9FA] text-[#0F172A] min-h-screen font-body-md flex flex-col">
<!-- Header Section -->
<header class="flex items-center justify-between px-6 py-4 sticky top-0 z-10 bg-[#F8F9FA]/90 backdrop-blur-md max-w-xl mx-auto w-full">
<div class="flex items-center gap-3">
<!-- Circular Progress Ring -->
<div class="relative w-9 h-9 flex items-center justify-center">
<svg class="w-full h-full -rotate-90">
<circle class="text-[#E2E8F0]" cx="18" cy="18" fill="transparent" r="15" stroke="currentColor" stroke-width="3"></circle>
<circle class="text-[#532CE6]" cx="18" cy="18" fill="transparent" r="15" stroke="currentColor" stroke-dasharray="94.2" stroke-dashoffset="0" stroke-width="3"></circle>
</svg>
<span class="absolute text-xs font-bold text-[#532CE6]">3</span>
</div>
<h1 class="text-lg font-bold text-[#0F172A]">Alertes</h1>
</div>
<div class="flex items-center gap-2">
<a class="inline-flex items-center gap-1.5 px-4 py-2 bg-white border border-[#EAECF0] text-[#532CE6] rounded-xl font-bold text-xs hover:bg-[#F5F3FF] active:scale-95 transition-all shadow-sm" href="./login_child_safety.html">
    <span class="material-symbols-outlined text-[16px]">login</span>
    <span>Se connecter</span>
</a>
<button class="font-semibold text-xs text-[#64748B] px-3 py-1.5 rounded-lg hover:bg-[#F1F5F9] transition-colors" onclick="handleSkipOnboarding()">
    Passer
</button>
</div>
</header>
<!-- Main Content: Stylized Map Illustration -->
<main class="flex-grow flex flex-col items-center justify-center px-6 max-w-xl mx-auto w-full relative overflow-hidden pb-8">
<div class="relative w-full max-w-[300px] aspect-square rounded-2xl bg-white shadow-sm p-4 overflow-hidden border border-[#EAECF0]">
<!-- Map Texture Placeholder -->
<img class="absolute inset-0 w-full h-full object-cover opacity-15 grayscale" alt="Carte" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqHUryaWnuUDbk8NLNmdwKmMLjbHUzlDrlEI9eovhSSVMeKg2_ckWcDvy9zRKk5RoBtt30awY5NpzhDtaUyj2_x18-HhvBifW6BeerqXxDiQgBBtjD5k8r7-BzZGYIqEcybvno1Rd_hwfDyR79midJGQ7mA1-hep-nO10gt2NVgEEmu7TQl9B3NyuuSZ0IfHiLU1Mg5_rU0qJW9ecEpdgaji5u2kyjFNf5OtdilRoiCskJwJx4sSy-ZAyVbgUUDE4cbeGTfOnx9cvJ"/>
<!-- Alert Ripples & Icons -->
<!-- Ripple 1 (Central Top) -->
<div class="absolute top-1/4 left-1/3">
<div class="absolute w-14 h-14 bg-red-500/20 rounded-full ripple -translate-x-1/2 -translate-y-1/2"></div>
<div class="relative z-10 w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center -translate-x-1/2 -translate-y-1/2 border-2 border-[#DC2626]">
<span class="material-symbols-outlined text-[#DC2626] text-[20px]" style="font-variation-settings: 'FILL' 1;">speaker_phone</span>
</div>
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-[#532CE6] rounded-full border border-white flex items-center justify-center -translate-x-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-[10px] text-white" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</div>
<!-- Ripple 2 (Bottom Left) -->
<div class="absolute bottom-1/4 left-1/4">
<div class="absolute w-16 h-16 bg-red-500/15 rounded-full ripple -translate-x-1/2 -translate-y-1/2" style="animation-delay: 0.5s;"></div>
<div class="relative z-10 w-9 h-9 bg-white rounded-full shadow-sm flex items-center justify-center -translate-x-1/2 -translate-y-1/2 border-2 border-[#DC2626]">
<span class="material-symbols-outlined text-[#DC2626] text-[18px]">volume_up</span>
</div>
</div>
<!-- Ripple 3 (Middle Right) -->
<div class="absolute top-1/2 right-1/4">
<div class="absolute w-20 h-20 bg-red-500/10 rounded-full ripple -translate-x-1/2 -translate-y-1/2" style="animation-delay: 1s;"></div>
<div class="relative z-10 w-11 h-11 bg-white rounded-full shadow-sm flex items-center justify-center -translate-x-1/2 -translate-y-1/2 border-2 border-[#DC2626]">
<span class="material-symbols-outlined text-[#DC2626] text-[22px]" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
</div>

<!-- Decorative Floating Elements -->
<div class="absolute top-4 right-4 w-10 h-10 bg-white rounded-xl shadow-sm flex items-center justify-center border border-[#EAECF0]">
<span class="material-symbols-outlined text-[#532CE6] text-[20px]" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-[#DC2626] rounded-full ring-2 ring-white"></div>
</div>

<span class="material-symbols-outlined text-[18px]">share</span>
</div>
</div>
<!-- Footer Content -->
<div class="px-2 mt-6 flex flex-col items-center text-center">
<h2 class="text-2xl font-bold text-[#0F172A] mb-2">Mobilisation Immédiate</h2>
<p class="text-sm text-[#64748B] max-w-[340px] mb-6 leading-relaxed">
    Recevez les alertes en temps réel dans votre zone. Ensemble, coordonnons nos actions pour retrouver chaque enfant sain et sauf.
</p>
<!-- Pagination Dots -->
<div class="flex gap-2 mb-6">
<div class="w-2.5 h-2.5 rounded-full bg-[#E2E8F0]"></div>
<div class="w-2.5 h-2.5 rounded-full bg-[#E2E8F0]"></div>
<div class="w-7 h-2 rounded-full bg-[#532CE6]"></div>
</div>
<!-- Action Button -->
<button id="getStartedBtn" class="w-full bg-[#532CE6] hover:bg-[#4321c4] text-white rounded-xl py-3.5 px-6 font-bold text-sm shadow-sm flex items-center justify-center gap-2 active:scale-98 transition-all" onclick="handleFinishOnboarding()">
    <span>Commencer</span>
    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple micro-interaction for the button
        document.querySelectorAll('footer button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
    </script>
<script type="module">
import { protectRoute, setOnboardingCompleted } from "./src/authService.js";

let currentUser = null;
try {
    const authInfo = await protectRoute('onboarding');
    currentUser = authInfo?.user;
} catch (e) {
    console.warn("Route protect notice:", e);
}

window.handleFinishOnboarding = async function() {
    const btn = document.getElementById('getStartedBtn');
    if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-80', 'cursor-wait');
    }
    await setOnboardingCompleted(currentUser);
    window.location.replace('./success_account_created.html');
};

window.handleSkipOnboarding = async function() {
    await setOnboardingCompleted(currentUser);
    window.location.replace('./home_child_safety_v1.html');
};
</script>
</body></html>
