name: Supabase Production Backend CI/CD

on:
  push:
    branches:
      - main
      - master
      - production
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase_deploy.yml'

jobs:
  deploy_backend:
    name: Deploy Migrations & Edge Functions to Supabase Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source of Truth
        uses: actions/checkout@v4

      # Project uses Bun (bun.lock), not npm — actions/setup-node with cache:'npm'
      # was failing before any Supabase step ran because no package-lock.json/
      # yarn.lock/npm-shrinkwrap.json exists. Switched to Bun's own setup+cache.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase link` required SUPABASE_DB_PASSWORD to establish a DB
      # connection and was failing at this step. It is not needed for a
      # function-only deploy: `supabase functions deploy` accepts
      # --project-ref directly, so the link/DB-password step is removed here.
      # TEMPORARILY DISABLED: the migration history in supabase/migrations/ does
      # not match what's already applied on Supabase Production (different
      # naming/version scheme, no overlap). Running `supabase db push` here would
      # attempt to apply all local migrations to Production, including schema
      # changes that have not been reviewed. Do not re-enable until the two
      # histories have been reconciled and reviewed explicitly.
      # - name: Apply Database Migrations
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #     SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      #   run: |
      #     echo "🚀 Applying pending SQL migrations to Supabase Cloud..."
      #     supabase db push --password "$SUPABASE_DB_PASSWORD"

      # Scoped to create-found-report only for this run. JWT verification is
      # kept ON (no --no-verify-jwt). The other functions listed here previously
      # (create-missing-report, matching-engine, ai-analysis, broadcast-alert,
      # admin-action, email-verification) are intentionally left out — none of
      # them are redeployed by this workflow run.
      - name: Deploy create-found-report Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🚀 Deploying create-found-report to Supabase Cloud (JWT verification enabled)..."
          supabase functions deploy create-found-report --project-ref ifpbdythbhlgqymsaxtz

      - name: Run Post-Deployment Drift Audit
        env:
          SUPABASE_URL: "https://ifpbdythbhlgqymsaxtz.supabase.co"
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          bun run audit:backend
