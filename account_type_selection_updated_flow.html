<script>
        function selectAccount(element) {
            // Remove active class from all cards
            document.querySelectorAll('.account-card').forEach(card => {
                card.classList.remove('active-selection');
            });
            
            // Add active class to selected card
            element.classList.add('active-selection');
            const role = element.querySelector('h3')?.innerText?.trim() || '';
            sessionStorage.setItem('childSafetyAccountType', role);
            
            // Enable and style continue button
            const continueBtn = document.getElementById('continue-btn');
            continueBtn.disabled = false;
            continueBtn.classList.remove('bg-outline', 'opacity-50', 'cursor-not-allowed');
            continueBtn.classList.add('bg-primary', 'shadow-[0_8px_25px_rgba(108,77,255,0.35)]', 'hover:shadow-[0_12px_32px_rgba(108,77,255,0.48)]', 'hover:scale-[1.01]', 'active:scale-[0.98]');
        }

        window.handleStepBack = function() {
            window.location.href = './sign_up_child_safety.html';
        };
    </script>
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
<script type="module">
import { supabase } from "./src/supabaseClient.js";
import { protectRoute } from "./src/authService.js";

// Check route: only redirect if user already has an active session with completed profile
await protectRoute('registration_step');

const continueBtn = document.getElementById('continue-btn');
const btnText = document.getElementById('btnText');
const btnIcon = document.getElementById('btnIcon');
const errorMsg = document.getElementById('errorMsg');
const errorText = document.getElementById('errorText');
const subtitleText = document.getElementById('subtitleText');

let isOAuthUser = false;

// Check if user is authenticated with Google
try {
    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
    const { data: { user }, error: userError } = await supabase.auth.getUser();

    console.log("=== [STEP 2: ACCOUNT TYPE SELECTION - SESSION CHECK] ===");
    console.log("SESSION:", session?.user?.id);
    console.log("GET USER:", user?.id);
    console.log("SESSION ERROR:", sessionError);
    console.log("USER ERROR:", userError);

    if (session && session.user) {
        isOAuthUser = true;
        sessionStorage.setItem('signup_is_google', 'true');
        const googleName = session.user.user_metadata?.full_name || session.user.user_metadata?.name || '';
        if (googleName && !sessionStorage.getItem('signup_fullname')) {
            sessionStorage.setItem('signup_fullname', googleName);
        }
        if (session.user.email && !sessionStorage.getItem('signup_email')) {
            sessionStorage.setItem('signup_email', session.user.email);
        }
        if (subtitleText && googleName) {
            subtitleText.textContent = `Bienvenue, ${googleName} ! Veuillez choisir votre rôle au sein de la communauté.`;
        }
    }
} catch (e) {
    console.warn("Session check notice on Step 2:", e);
}

// Restore previously selected role if user navigated back from Step 3
const savedRole = sessionStorage.getItem('childSafetyAccountType');
if (savedRole) {
    document.querySelectorAll('.account-card').forEach(card => {
        const cardRole = card.querySelector('h3')?.innerText?.trim() || '';
        if (cardRole.toLowerCase() === savedRole.toLowerCase() || savedRole.toLowerCase().includes(cardRole.toLowerCase())) {
            selectAccount(card);
        }
    });
}

function showError(msg) {
    if (errorText && errorMsg) {
        errorText.textContent = msg;
        errorMsg.classList.remove('hidden');
        errorMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
        alert(msg);
    }
}

function setLoading(isLoading) {
    if (isLoading) {
        continueBtn.disabled = true;
        if (btnText) btnText.textContent = 'Chargement...';
        if (btnIcon) {
            btnIcon.textContent = 'pending';
            btnIcon.classList.add('animate-spin');
        }
    } else {
        continueBtn.disabled = false;
        if (btnText) btnText.textContent = 'Continuer';
        if (btnIcon) {
            btnIcon.textContent = 'arrow_forward';
            btnIcon.classList.remove('animate-spin');
        }
    }
}

continueBtn.addEventListener('click', (e) => {
    e.preventDefault();
    
    if (errorMsg) errorMsg.classList.add('hidden');
    
    const role = sessionStorage.getItem('childSafetyAccountType');
    if (!role) {
        showError('Veuillez sélectionner votre rôle pour continuer.');
        return;
    }

    if (!isOAuthUser) {
        const fullname = sessionStorage.getItem('signup_fullname') || '';
        const email = sessionStorage.getItem('signup_email') || '';
        const password = sessionStorage.getItem('signup_password') || '';
        if (!email || !password || !fullname) {
            showError('Les informations de l\'étape 1 sont manquantes. Veuillez revenir à l\'étape 1.');
            return;
        }
    }
    
    setLoading(true);
    
    try {
        console.log('Step 2 complete. Account type selected:', role);
        window.location.href = './basic_information.html';
    } catch (err) {
        console.error('Unexpected routing error:', err);
        showError('Une erreur inattendue est survenue. Veuillez réessayer.');
        setLoading(false);
    }
});
</script>
