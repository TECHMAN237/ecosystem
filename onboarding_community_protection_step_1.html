<body class="bg-[#F8F9FA] text-[#0F172A] font-body-md antialiased min-h-screen flex flex-col overflow-x-hidden">

<header class="flex items-center justify-between px-6 py-4 sticky top-0 z-10 bg-[#F8F9FA]/90 backdrop-blur-md max-w-xl mx-auto w-full">

</a>
<button class="font-semibold text-xs text-[#64748B] px-3 py-1.5 rounded-lg hover:bg-[#F1F5F9] transition-colors" onclick="handleSkipOnboarding()">
    Passer
</button>
</header>
<main class="flex-1 flex flex-col px-6 max-w-xl mx-auto w-full pb-8">
<!-- Step Indicator Header -->

<div class="bg-white w-full h-full rounded-full flex items-center justify-center shadow-xs">

</div>
</div>
<h1 class="text-lg font-bold text-[#0F172A]">Protection Communautaire</h1>
</div>
<!-- Central Illustration Card -->
<div class="flex-1 flex items-center justify-center min-h-[260px] mb-8">
<div class="relative w-full aspect-square max-w-[280px] rounded-2xl bg-white border border-[#EAECF0] shadow-sm flex items-center justify-center overflow-visible">
<!-- Shield Badge (Top Right) -->
<div class="absolute -top-3 -right-3 w-12 h-12 bg-[#532CE6] rounded-xl flex items-center justify-center shadow-sm text-white">
<span class="material-symbols-outlined text-[24px]">security</span>
</div>
<!-- Network Illustration Placeholder -->
<div class="w-full h-full p-8 flex items-center justify-center">
<img alt="Visualisation réseau" class="w-full h-auto object-contain opacity-85" src="https://lh3.googleusercontent.com/aida-public/AB6AXuADqFPuj3wSERecz-BxOUAtUWf8eTn5rf1opX0BUl5DSoq6Tf4w2HSEEp5pWN7c9VWU1T85asUWVuMNNwseeugbOUcLH3tA9Lyh3LWXle6VmcIEMOcmaX3NVtsEPUY1cjMwxFXWwvRw0Ux2qPPut-KjXF1D8ETLaEgyRV-fyBrkd-czG3lUSIPJPYKtOaHUtysfY921Xz-RepXiXcU2QvsaPDckzvlnHGbzvLjdD7_YY0ycX9qhqzEJ-acJNEhoh2Js959TZ9w18E5J"/>
</div>
<!-- Community Badge (Bottom Left) -->

<span class="material-symbols-outlined text-[24px]">group</span>
</div>
</div>
</div>
<!-- Content Area -->
<div class="text-center space-y-2 mb-8">
<h2 class="text-2xl font-bold text-[#0F172A]">Ensemble pour la Sécurité</h2>
<p class="text-sm text-[#64748B] max-w-[340px] mx-auto leading-relaxed">
    Créez un réseau d'entraide vigilant. Signalez les disparitions et recevez des alertes instantanées pour protéger chaque enfant.
</p>
</div>
<!-- Footer Actions -->
<footer class="mt-auto flex flex-col items-center gap-6 w-full">
<!-- Pagination Dots -->
<div class="flex gap-2">
<div class="w-7 h-2 rounded-full bg-[#532CE6]"></div>

</button>

<div class="fixed -top-20 -right-20 w-80 h-80 bg-surface-tint opacity-[0.05] rounded-full blur-3xl"></div>
<script type="module">
import { protectRoute, setOnboardingCompleted } from "./src/authService.js";

let currentUser = null;
try {
    const authInfo = await protectRoute('onboarding');
    currentUser = authInfo?.user;
} catch (e) {
    console.warn("Route protect notice:", e);
}

window.handleSkipOnboarding = async function() {
    await setOnboardingCompleted(currentUser);
    window.location.replace('./home_child_safety_v1.html');
};
</script>
