</button>

            : allAlertsData.filter(a => a.category === currentCategory);

        // Update counts

        document.getElementById('count-EMERGENCY').textContent = allAlertsData.filter(a => a.category === 'EMERGENCY').length;

                            </div>
                        </div>
                        <p class="font-body-md text-body-md text-on-surface-variant mb-lg">${alt.description}</p>
                        <div class="flex gap-md">
                            <button class="flex-1 py-md border border-outline-variant text-on-surface-variant rounded-full font-label-bold text-label-bold active:scale-95 transition-transform" onclick="markAsRead('${alt.id}')">Dismiss</button>
                            <button class="flex-1 py-md bg-primary text-on-primary rounded-full font-label-bold text-label-bold shadow-md active:scale-95 transition-transform" onclick="window.location.href='${alt.actionUrl}'; markAsRead('${alt.id}')">${alt.actionText}</button>
                        </div>
                    </div>
                </div>`;
            } else if (alt.category === 'REPORT') {
                html += `
                <div class="bg-surface rounded-lg shadow-[0px_4px_20px_rgba(108,77,255,0.06)] p-lg flex gap-md items-start relative">
                    ${unreadIndicator}
                    <div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-on-surface-variant">description</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h3 class="font-headline-md text-headline-md text-on-surface">${alt.title}</h3>
                            <span class="font-label-sm text-label-sm text-on-surface-variant">${alt.timestamp}</span>
                        </div>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-base">${alt.description}</p>
                        <button class="mt-md text-primary font-label-bold text-label-bold flex items-center gap-xs" onclick="window.location.href='${alt.actionUrl || './report_details.html'}'; markAsRead('${alt.id}')">
                            ${alt.actionText || 'View Report'} <span class="material-symbols-outlined text-sm">arrow_forward</span>
                        </button>
                    </div>
                </div>`;
            } else if (alt.category === 'COMMUNITY') {
                html += `
                <div class="bg-surface rounded-lg shadow-[0px_4px_20px_rgba(108,77,255,0.06)] overflow-hidden border-t border-primary/5 relative">
                    ${unreadIndicator}
                    <div class="bg-primary/5 p-lg border-l-4 border-primary">
                        <div class="flex items-center gap-sm mb-sm">
                            <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">groups</span>
                            <span class="font-label-bold text-label-bold text-primary">COMMUNITY BEACON ACTIVE</span>
                        </div>
                        <h3 class="font-headline-md text-headline-md text-on-surface">${alt.title}</h3>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-base">${alt.description}</p>
                        <button class="w-full mt-lg py-md bg-white border border-primary text-primary rounded-full font-label-bold text-label-bold shadow-sm hover:bg-primary/5 active:scale-95 transition-all" onclick="window.location.href='${alt.actionUrl || './report_details.html'}'; markAsRead('${alt.id}')">${alt.actionText || 'Help Nearby'}</button>
                    </div>
                </div>`;
            }
        });

        container.innerHTML = html;
    }

    function markAsRead(id) {
        const alt = allAlertsData.find(a => a.id === id);
        if (alt) {
            alt.read = true;
            renderAlerts();
        }
    }

    document.getElementById('markAllReadBtn').addEventListener('click', () => {
        allAlertsData.forEach(a => a.read = true);
        renderAlerts();
    });

    // Setup chip filtering
    document.querySelectorAll('#filterChipsContainer button').forEach(btn => {
        btn.addEventListener('click', function() {
            const cat = this.getAttribute('data-category');
            currentCategory = cat;

            // Update chip styles
            document.querySelectorAll('#filterChipsContainer button').forEach(b => {
                b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md', 'font-label-bold');
                b.classList.add('bg-surface-container', 'text-on-surface-variant', 'font-label-sm');
            });
            this.classList.remove('bg-surface-container', 'text-on-surface-variant', 'font-label-sm');
            this.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'font-label-bold');

            renderAlerts();
        });
    });

    // Pull-to-refresh simulation
    let touchStartY = 0;
    const indicator = document.getElementById('pullRefreshIndicator');

    window.addEventListener('touchstart', e => {
        touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', e => {
        const touchEndY = e.changedTouches[0].clientY;
        if (touchEndY - touchStartY > 120 && window.scrollY <= 10) {
            indicator.classList.remove('hidden');
            setTimeout(() => {
                indicator.classList.add('hidden');
                renderAlerts();
            }, 1000);
        }
    });

    // Pagination / Infinite scroll simulation
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
        const btn = document.getElementById('loadMoreBtn');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Chargement des alertes antérieures...';
        setTimeout(() => {
            // Append some past archive alerts
            allAlertsData.push({
                id: 'alt-' + (allAlertsData.length + 1),
                category: 'COMMUNITY',
                title: 'Community Safety Broadcast (Archive)',
                description: "Weekly safety check-in completed across 14 zones.",
                timestamp: '2d ago',
                read: true,
                priority: 'normal',
                type: 'community',
                actionText: 'View Report',
                actionUrl: './reports_directory.html'
            });
            btn.innerHTML = "Charger plus d'alertes (Pagination active)";
            renderAlerts();
        }, 800);
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
        renderAlerts();
    });
</script>
</main>

<script>

            });

        // Atmospheric Scroll Effect for Header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');

                header.classList.add('shadow-md');
                header.style.backgroundColor = 'rgba(246, 247, 249, 0.95)';

                header.style.backdropFilter = 'none';
            }
        });

    <script>
        // Guest restriction check
        function showGuestRestrictionAlert() {
            if (document.getElementById('guest-restriction-modal')) return;
            
            const modal = document.createElement('div');
            modal.id = 'guest-restriction-modal';
            modal.className = 'fixed inset-0 z-[100] flex items-center justify-center p-md bg-black/60 backdrop-blur-sm transition-all duration-300';
            modal.innerHTML = `
                <div class="bg-surface-container-lowest rounded-2xl p-lg max-w-sm w-full shadow-2xl border border-primary/10 text-center transform scale-95 transition-transform duration-300">
                    <div class="w-16 h-16 bg-primary-container/10 text-primary rounded-full flex items-center justify-center mx-auto mb-md">
                        <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
                    </div>
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Accès Restreint</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant mb-lg leading-relaxed text-center">

                    </p>
                    <div class="flex flex-col gap-sm">

                            <span class="material-symbols-outlined mr-2 text-[22px]">person_add</span>
                            <span>Créer un compte</span>
                        </a>
                        <a href="./login_child_safety.html" class="w-full py-3 border-2 border-primary text-primary hover:bg-primary/10 rounded-full font-label-bold text-label-bold active:scale-95 transition-all block text-center shadow-sm">
                            Se connecter
                        </a>
                        <button id="closeGuestModal" class="w-full py-2.5 text-on-surface-variant hover:bg-surface-container-high rounded-full font-label-bold text-label-bold active:scale-95 transition-all">
                            Plus tard
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                modal.querySelector('.transform').classList.remove('scale-95');
            }, 10);

            document.getElementById('closeGuestModal').addEventListener('click', () => {
                modal.querySelector('.transform').classList.add('scale-95');
                modal.style.opacity = '0';
                setTimeout(() => modal.remove(), 200);
            });
        }

        if (localStorage.getItem('is_guest') === 'true') {
            document.addEventListener('click', (e) => {
                const target = e.target.closest('a, button');
                if (!target) return;
                
                const href = target.getAttribute('href') || '';
                const onclick = target.getAttribute('onclick') || '';
                
                const isRestrictedPath = href.includes('guardian_profile') || 
                                         href.includes('signaler_un_disparu') || 
                                         href.includes('signaler_un_enfant_trouv') || 
                                         href.includes('v2_smart_device') || 
                                         href.includes('ai_smart_matching') ||
                                         onclick.includes('guardian_profile') || 
                                         onclick.includes('signaler_un_disparu') || 
                                         onclick.includes('signaler_un_enfant_trouv') || 
                                         onclick.includes('v2_smart_device') ||
                                         onclick.includes('ai_smart_matching');
                
                if (isRestrictedPath) {
                    e.preventDefault();
                    e.stopPropagation();
                    showGuestRestrictionAlert();
                }
            }, true);
        }
    </script>
