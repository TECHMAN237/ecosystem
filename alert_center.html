<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top App Bar (Mobile Only) -->
<header class="flex md:hidden justify-between items-center px-container-margin py-md w-full sticky top-0 z-50 bg-background shadow-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary font-bold" style="font-variation-settings: 'FILL' 1;">shield</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">SafeGuardian</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-opacity active:scale-95 duration-200" onclick="window.location.href='./notifications_settings.html'">
<span class="material-symbols-outlined text-on-surface-variant">notifications_active</span>
</button>
</header>
<main class="flex-grow pb-32 pt-1 md:ml-64 md:max-w-4xl md:mx-auto">
<!-- Screen Header -->
<section class="px-container-margin pt-lg pb-md">
<div class="flex items-center justify-between">
<div>
<h2 class="font-display text-display text-on-surface">Alerts</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">Stay informed about reports, matches, community activity, and safety updates.</p>
</div>
<div class="flex items-center gap-xs">
<button id="markAllReadBtn" class="px-md py-2 text-xs font-label-bold text-primary bg-primary/10 hover:bg-primary/20 rounded-full transition-colors">Tout marquer comme lu</button>
</div>
</div>
</section>
<!-- Filter Chips -->
<section class="px-container-margin mb-lg overflow-x-auto hide-scrollbar flex gap-2 items-center pb-1" id="filterChipsContainer">
<button data-category="all" class="px-4 py-2 rounded-full bg-primary text-white font-bold text-xs shadow-sm whitespace-nowrap flex items-center gap-1.5 transition-all">
    Tous <span id="count-all" class="px-1.5 py-0.5 bg-white/20 text-white font-bold text-[10px] rounded-full">0</span>
</button>
<button data-category="EMERGENCY" class="px-4 py-2 rounded-full bg-white text-[#64748B] hover:text-[#0F172A] border border-[#EAECF0] font-medium text-xs whitespace-nowrap flex items-center gap-1.5 transition-all">
    Urgences <span id="count-EMERGENCY" class="px-1.5 py-0.5 bg-[#FEF2F2] text-[#DC2626] font-bold text-[10px] rounded-full border border-[#FECACA]">0</span>
</button>
<button data-category="REPORT" class="px-4 py-2 rounded-full bg-white text-[#64748B] hover:text-[#0F172A] border border-[#EAECF0] font-medium text-xs whitespace-nowrap flex items-center gap-1.5 transition-all">
    Signalements <span id="count-REPORT" class="px-1.5 py-0.5 bg-[#F8F9FA] text-[#64748B] font-bold text-[10px] rounded-full border border-[#EAECF0]">0</span>
</button>
<button data-category="COMMUNITY" class="px-4 py-2 rounded-full bg-white text-[#64748B] hover:text-[#0F172A] border border-[#EAECF0] font-medium text-xs whitespace-nowrap flex items-center gap-1.5 transition-all">
    Communauté <span id="count-COMMUNITY" class="px-1.5 py-0.5 bg-[#F8F9FA] text-[#64748B] font-bold text-[10px] rounded-full border border-[#EAECF0]">0</span>
</button>
<button data-category="MATCH" class="px-4 py-2 rounded-full bg-white text-[#64748B] hover:text-[#0F172A] border border-[#EAECF0] font-medium text-xs whitespace-nowrap flex items-center gap-1.5 transition-all">
    Correspondances <span id="count-MATCH" class="px-1.5 py-0.5 bg-[#F5F3FF] text-[#532CE6] font-bold text-[10px] rounded-full border border-[#532CE6]/20">0</span>
</button>
<button data-category="WEARABLE" class="px-4 py-2 rounded-full bg-white text-[#64748B] hover:text-[#0F172A] border border-[#EAECF0] font-medium text-xs whitespace-nowrap flex items-center gap-1.5 transition-all">
    Objets Connectés <span id="count-WEARABLE" class="px-1.5 py-0.5 bg-[#F8F9FA] text-[#64748B] font-bold text-[10px] rounded-full border border-[#EAECF0]">0</span>
</button>
</section>

<!-- Pull to Refresh Indicator -->
<div id="pullRefreshIndicator" class="text-center py-2 text-xs text-on-surface-variant hidden">
    <span class="inline-flex items-center gap-1"><span class="material-symbols-outlined animate-spin text-sm">sync</span> Actualisation...</span>
</div>

<!-- Feed Content -->
<div class="px-container-margin space-y-lg" id="alertsFeedContainer">
    <!-- Dynamically rendered alert cards with Supabase readiness & pagination -->
</div>

<!-- Pagination / Load More -->
<div class="px-container-margin py-xl text-center" id="loadMoreContainer">
    <button id="loadMoreBtn" class="px-8 py-3 bg-surface-container-high hover:bg-surface-container-highest text-on-surface rounded-full font-label-bold text-label-bold transition-all shadow-sm">
        Charger plus d'alertes (Pagination active)
    </button>
</div>

<script>
    // Comprehensive alert dataset covering all 6 categories with Supabase readiness structure
    const allAlertsData = [
        {
            id: 'alt-1',
            category: 'EMERGENCY',
            title: 'Liam est porté disparu',

        {

        },
        {
            id: 'alt-5',
            category: 'COMMUNITY',
            title: 'Nearby Missing Child',
            description: "A beacon was activated 1.2 miles away from your current location.",
            timestamp: '25m ago',
            read: false,
            priority: 'normal',
            type: 'community',
            actionText: 'Help Nearby',
            actionUrl: './report_details.html'
        },
        {
            id: 'alt-6',
            category: 'EMERGENCY',
            title: 'Battery Critical - Tracker Alpha',
            subtitle: 'School Zone Perimeter',
            description: "Device battery has dropped below 5%. Immediate recharge required.",
            timestamp: '1h ago',
            read: true,
            priority: 'high',
            type: 'emergency_broadcast',
            actionText: 'Device Status',
            actionUrl: './emergency_preferences.html'
        },
        {
            id: 'alt-7',
            category: 'REPORT',
            title: 'Missing Report Submitted',
            description: "Case #MS-2026-881 successfully registered in the secure database.",
            timestamp: '2h ago',
            read: true,
            priority: 'normal',
            type: 'report',
            actionText: 'View Report',
            actionUrl: './reports_directory.html'
        },
        {
            id: 'alt-8',
            category: 'COMMUNITY',
            title: 'New Helper Joined',
            description: "15 new certified volunteers joined your local neighborhood safety grid.",
            timestamp: '3h ago',
            read: true,
            priority: 'normal',
            type: 'community',
            actionText: 'View Community',
            actionUrl: './home_child_safety_v1.html'
        },
        {
            id: 'alt-9',
            category: 'MATCH',
            title: 'Forte correspondance trouvée',
            confidence: '95% de similarité',
            description: "Score de similarité faciale élevé détecté par le moteur de comparaison biométrique.",
            timestamp: 'Il y a 4h',
            read: true,
            priority: 'normal',
            type: 'match',
            databasePhoto: '/assets/children/child-02.webp',
            foundPhoto: '/assets/children/child-08.webp',
            actionText: 'Examiner le match',
            actionUrl: './ai_smart_matching.html'
        },
        {
            id: 'alt-10',
            category: 'WEARABLE',
            title: 'Device Offline - Bracelet Beta',
            description: "Tracker heartbeat lost for over 15 minutes. Checking GSM signal.",
            timestamp: '5h ago',
            read: true,
            priority: 'normal',
            type: 'wearable',
            actionText: 'Troubleshoot',
            actionUrl: './emergency_preferences.html'
        },
        {
            id: 'alt-11',
            category: 'WEARABLE',
            title: 'GPS Restored - Sarahs Watch',
            description: "Satellite fix successfully acquired in outdoor urban sector.",
            timestamp: '6h ago',
            read: true,
            priority: 'normal',
            type: 'wearable'
        }
    ];

    let currentCategory = 'all';

    function renderAlerts() {
        const container = document.getElementById('alertsFeedContainer');
        if (!container) return;

        const filtered = currentCategory === 'all' 
            ? allAlertsData 
            : allAlertsData.filter(a => a.category === currentCategory);

        // Update counts
        document.getElementById('count-all').textContent = allAlertsData.length;
        document.getElementById('count-EMERGENCY').textContent = allAlertsData.filter(a => a.category === 'EMERGENCY').length;
        document.getElementById('count-REPORT').textContent = allAlertsData.filter(a => a.category === 'REPORT').length;
        document.getElementById('count-COMMUNITY').textContent = allAlertsData.filter(a => a.category === 'COMMUNITY').length;
        document.getElementById('count-MATCH').textContent = allAlertsData.filter(a => a.category === 'MATCH').length;
        document.getElementById('count-WEARABLE').textContent = allAlertsData.filter(a => a.category === 'WEARABLE').length;

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="bg-surface rounded-xl p-xl text-center shadow-sm border border-outline-variant/20">
                    <span class="material-symbols-outlined text-4xl text-outline mb-2">notifications_off</span>
                    <h3 class="font-headline-md text-headline-md text-on-surface">Aucune alerte dans cette catégorie</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Vous êtes à jour. Aucune nouvelle notification pour le moment.</p>
                </div>
            `;
            return;
        }

        let html = '';
        filtered.forEach(alt => {
            const unreadIndicator = !alt.read ? '<span class="absolute top-4 right-4 w-2.5 h-2.5 rounded-full bg-primary ring-2 ring-white"></span>' : '';

            if (alt.category === 'EMERGENCY') {
                html += `
                <div class="relative bg-[#FEF2F2] rounded-2xl border border-[#FECACA] p-5 shadow-sm">
                    ${unreadIndicator}
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <span class="flex h-2.5 w-2.5 rounded-full bg-[#DC2626] animate-pulse"></span>
                            <span class="font-bold text-xs text-[#DC2626] uppercase tracking-wider">${alt.title.includes('Battery') ? 'Alerte Système' : 'Alerte Urgente'}</span>
                        </div>
                        <span class="text-xs text-[#64748B] font-medium">${alt.timestamp}</span>
                    </div>
                    <div class="flex gap-4 items-center">
                        ${alt.photo ? `<img alt="Photo Alerte" class="w-20 h-20 rounded-xl object-cover border border-[#FECACA] shadow-sm shrink-0" src="${alt.photo}"/>` : `<div class="w-16 h-16 rounded-xl bg-[#FEE2E2] text-[#DC2626] flex items-center justify-center shrink-0 border border-[#FECACA]"><span class="material-symbols-outlined text-2xl">warning</span></div>`}
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-base text-[#0F172A]">${alt.title}</h3>
                            ${alt.subtitle ? `<p class="font-semibold text-xs text-[#DC2626] mt-0.5">${alt.subtitle}</p>` : ''}
                            <p class="text-sm text-[#475569] mt-1 line-clamp-2">${alt.description}</p>
                        </div>
                    </div>
                    <button class="w-full mt-4 py-2.5 bg-[#DC2626] hover:bg-[#B91C1C] text-white rounded-xl font-bold text-sm shadow-sm active:scale-98 transition-all" onclick="window.location.href='${alt.actionUrl || './report_details.html'}'; markAsRead('${alt.id}')">${alt.actionText || 'Voir les détails'}</button>
                </div>`;
            } else if (alt.category === 'WEARABLE') {
                html += `
                <div class="bg-white rounded-2xl border border-[#EAECF0] p-5 shadow-sm hover:shadow-md transition-all relative">
                    ${unreadIndicator}
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[#532CE6] text-xl" style="font-variation-settings: 'FILL' 1;">watch</span>
                            <span class="bg-[#F5F3FF] text-[#532CE6] border border-[#532CE6]/15 font-bold text-xs px-2.5 py-0.5 rounded-full">Objet Connecté V2</span>
                        </div>
                        <span class="text-xs text-[#64748B] font-medium">${alt.timestamp}</span>
                    </div>
                    <h3 class="font-bold text-base text-[#0F172A]">${alt.title}</h3>
                    <p class="text-sm text-[#64748B] mt-1">${alt.description}</p>
                    ${alt.actionTextPrimary ? `
                    <div class="flex gap-3 mt-4">
                        <button class="flex-1 py-2.5 bg-[#532CE6] text-white rounded-xl font-bold text-sm shadow-sm active:scale-98 transition-all hover:bg-[#4321C4]" onclick="markAsRead('${alt.id}')">${alt.actionTextPrimary}</button>
                        <button class="flex-1 py-2.5 bg-[#F1F5F9] text-[#0F172A] rounded-xl font-bold text-sm border border-[#EAECF0] active:scale-98 transition-all hover:bg-[#E2E8F0]" onclick="markAsRead('${alt.id}')">${alt.actionTextSecondary}</button>
                    </div>` : `
                    <button class="w-full mt-4 py-2.5 bg-[#F1F5F9] text-[#0F172A] rounded-xl font-bold text-sm border border-[#EAECF0] active:scale-98 transition-all hover:bg-[#E2E8F0]" onclick="markAsRead('${alt.id}')">Détails de l'appareil</button>`}
                </div>`;
            } else if (alt.category === 'MATCH') {
                html += `
                <div class="bg-white rounded-2xl border border-[#EAECF0] p-5 shadow-sm hover:shadow-md hover:border-[#532CE6]/30 transition-all relative">
                    ${unreadIndicator}
                    <div class="flex justify-between items-center mb-3">
                        <div class="bg-[#F5F3FF] text-[#532CE6] border border-[#532CE6]/15 px-2.5 py-0.5 rounded-full flex items-center gap-1.5 text-xs font-bold">
                            <span class="material-symbols-outlined text-sm">verified_user</span>
                            <span>${alt.title}</span>
                        </div>
                        <span class="text-xs font-bold text-[#532CE6] bg-[#F5F3FF] px-2 py-0.5 rounded-md">${alt.confidence}</span>
                    </div>
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <div class="flex-1 text-center">
                            <img alt="Base de données" class="w-full aspect-square rounded-xl object-cover grayscale opacity-70 border border-[#EAECF0]" src="${alt.databasePhoto}"/>
                            <span class="text-[11px] text-[#64748B] font-medium mt-1.5 block">Signalé</span>
                        </div>
                        <span class="material-symbols-outlined text-[#532CE6] text-2xl">compare_arrows</span>
                        <div class="flex-1 text-center">
                            <img alt="Trouvé" class="w-full aspect-square rounded-xl object-cover border border-[#532CE6]/30" src="${alt.foundPhoto}"/>
                            <span class="text-[11px] text-[#532CE6] font-bold mt-1.5 block">Identifié</span>
                        </div>
                    </div>
                    <p class="text-sm text-[#64748B] mb-4">${alt.description}</p>
                    <div class="flex gap-3">
                        <button class="flex-1 py-2.5 border border-[#EAECF0] text-[#64748B] hover:text-[#0F172A] hover:bg-[#F8F9FA] rounded-xl font-bold text-sm transition-all" onclick="markAsRead('${alt.id}')">Ignorer</button>
                        <button class="flex-1 py-2.5 bg-[#532CE6] text-white rounded-xl font-bold text-sm shadow-sm hover:bg-[#4321C4] transition-all" onclick="window.location.href='${alt.actionUrl}'; markAsRead('${alt.id}')">${alt.actionText || 'Examiner'}</button>
                    </div>
                </div>`;
            } else if (alt.category === 'REPORT') {
                html += `
                <div class="bg-white rounded-2xl border border-[#EAECF0] p-5 shadow-sm hover:shadow-md transition-all flex gap-4 items-start relative">
                    ${unreadIndicator}
                    <div class="w-11 h-11 bg-[#F1F5F9] border border-[#EAECF0] rounded-xl flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-[#64748B] text-xl">description</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-base text-[#0F172A]">${alt.title}</h3>
                            <span class="text-xs text-[#64748B] font-medium">${alt.timestamp}</span>
                        </div>
                        <p class="text-sm text-[#64748B] mt-1">${alt.description}</p>
                        <button class="mt-3 text-[#532CE6] font-bold text-xs flex items-center gap-1 hover:underline" onclick="window.location.href='${alt.actionUrl || './report_details.html'}'; markAsRead('${alt.id}')">
                            ${alt.actionText || 'Voir le rapport'} <span class="material-symbols-outlined text-sm">arrow_forward</span>
                        </button>
                    </div>
                </div>`;
            } else if (alt.category === 'COMMUNITY') {
                html += `
                <div class="bg-white rounded-2xl border border-[#EAECF0] p-5 shadow-sm hover:shadow-md transition-all relative">
                    ${unreadIndicator}
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-1.5 bg-[#F5F3FF] text-[#532CE6] border border-[#532CE6]/15 px-2.5 py-0.5 rounded-full text-xs font-bold">
                            <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">groups</span>
                            <span>COMMUNAUTÉ ACTIVE</span>
                        </div>
                        <span class="text-xs text-[#64748B] font-medium">${alt.timestamp}</span>
                    </div>
                    <h3 class="font-bold text-base text-[#0F172A] mt-2">${alt.title}</h3>
                    <p class="text-sm text-[#64748B] mt-1">${alt.description}</p>
                    <button class="w-full mt-4 py-2.5 bg-white border border-[#532CE6] text-[#532CE6] hover:bg-[#F5F3FF] rounded-xl font-bold text-sm shadow-sm active:scale-98 transition-all" onclick="window.location.href='${alt.actionUrl || './report_details.html'}'; markAsRead('${alt.id}')">${alt.actionText || 'Participer'}</button>
                </div>`;
            }
        });

        container.innerHTML = html;
    }

    function markAsRead(id) {
        const alt = allAlertsData.find(a => a.id === id);
        if (alt) {
            alt.read = true;
            renderAlerts();
        }
    }

    document.getElementById('markAllReadBtn').addEventListener('click', () => {
        allAlertsData.forEach(a => a.read = true);
        renderAlerts();
    });

    // Setup chip filtering
    document.querySelectorAll('#filterChipsContainer button').forEach(btn => {
        btn.addEventListener('click', function() {
            const cat = this.getAttribute('data-category');
            currentCategory = cat;

            // Update chip styles
            document.querySelectorAll('#filterChipsContainer button').forEach(b => {
                b.className = 'px-4 py-2 rounded-full bg-white text-[#64748B] hover:text-[#0F172A] border border-[#EAECF0] font-medium text-xs whitespace-nowrap flex items-center gap-1.5 transition-all';
            });
            this.className = 'px-4 py-2 rounded-full bg-primary text-white font-bold text-xs shadow-sm whitespace-nowrap flex items-center gap-1.5 transition-all';

            renderAlerts();
        });
    });

    // Pull-to-refresh simulation
    let touchStartY = 0;
    const indicator = document.getElementById('pullRefreshIndicator');

    window.addEventListener('touchstart', e => {
        touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', e => {
        const touchEndY = e.changedTouches[0].clientY;
        if (touchEndY - touchStartY > 120 && window.scrollY <= 10) {
            indicator.classList.remove('hidden');
            setTimeout(() => {
                indicator.classList.add('hidden');
                renderAlerts();
            }, 1000);
        }
    });

    // Pagination / Infinite scroll simulation
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
        const btn = document.getElementById('loadMoreBtn');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Chargement des alertes antérieures...';
        setTimeout(() => {
            // Append some past archive alerts
            allAlertsData.push({
                id: 'alt-' + (allAlertsData.length + 1),
                category: 'COMMUNITY',
                title: 'Community Safety Broadcast (Archive)',
                description: "Weekly safety check-in completed across 14 zones.",
                timestamp: '2d ago',
                read: true,
                priority: 'normal',
                type: 'community',
                actionText: 'View Report',
                actionUrl: './reports_directory.html'
            });
            btn.innerHTML = "Charger plus d'alertes (Pagination active)";
            renderAlerts();
        }, 800);
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
        renderAlerts();
    });
</script>
</main>

<span class="material-symbols-outlined text-3xl">add_alert</span>

<script>
        // Micro-interaction for filter chips
        const chips = document.querySelectorAll('button[class*="rounded-full"]');
        chips.forEach(chip => {
            chip.addEventListener('click', function() {
                // If it's a filter chip
                if(this.parentElement.classList.contains('overflow-x-auto')) {
                    chips.forEach(c => {
                        if(c.parentElement.classList.contains('overflow-x-auto')) {
                            c.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
                            c.classList.add('bg-surface-container', 'text-on-surface');
                            c.classList.remove('font-label-bold');
                            c.classList.add('font-label-sm');
                        }
                    });
                    this.classList.remove('bg-surface-container', 'text-on-surface');
                    this.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'font-label-bold');
                    this.classList.remove('font-label-sm');
                }
            });
        });

        // Atmospheric Scroll Effect for Header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
                header.style.backgroundColor = 'rgba(246, 247, 249, 0.95)';
                header.style.backdropFilter = 'blur(10px)';
            } else {
                header.classList.remove('shadow-md');
                header.style.backgroundColor = '#F5F4F2';
                header.style.backdropFilter = 'none';
            }
        });
    </script>

    <script>
        // Guest restriction check
        function showGuestRestrictionAlert() {
            if (document.getElementById('guest-restriction-modal')) return;
            
            const modal = document.createElement('div');
            modal.id = 'guest-restriction-modal';
            modal.className = 'fixed inset-0 z-[100] flex items-center justify-center p-md bg-black/60 backdrop-blur-sm transition-all duration-300';
            modal.innerHTML = `
                <div class="bg-surface-container-lowest rounded-2xl p-lg max-w-sm w-full shadow-2xl border border-primary/10 text-center transform scale-95 transition-transform duration-300">
                    <div class="w-16 h-16 bg-primary-container/10 text-primary rounded-full flex items-center justify-center mx-auto mb-md">
                        <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
                    </div>
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Accès Restreint</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant mb-lg leading-relaxed text-center">
                        Veuillez créer un compte ou vous connecter pour continuer.
                    </p>
                    <div class="flex flex-col gap-sm">
                        <a href="./sign_up_child_safety.html" class="w-full h-14 inline-flex items-center justify-center bg-primary text-on-primary rounded-full font-bold text-[17px] shadow-[0_8px_25px_rgba(108,77,255,0.35)] hover:shadow-[0_12px_32px_rgba(108,77,255,0.48)] hover:scale-[1.01] active:scale-[0.98] transition-all duration-200 text-center tracking-wide">
                            <span class="material-symbols-outlined mr-2 text-[22px]">person_add</span>
                            <span>Créer un compte</span>
                        </a>
                        <a href="./login_child_safety.html" class="w-full py-3 border-2 border-primary text-primary hover:bg-primary/10 rounded-full font-label-bold text-label-bold active:scale-95 transition-all block text-center shadow-sm">
                            Se connecter
                        </a>
                        <button id="closeGuestModal" class="w-full py-2.5 text-on-surface-variant hover:bg-surface-container-high rounded-full font-label-bold text-label-bold active:scale-95 transition-all">
                            Plus tard
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                modal.querySelector('.transform').classList.remove('scale-95');
            }, 10);

            document.getElementById('closeGuestModal').addEventListener('click', () => {
                modal.querySelector('.transform').classList.add('scale-95');
                modal.style.opacity = '0';
                setTimeout(() => modal.remove(), 200);
            });
        }

        if (localStorage.getItem('is_guest') === 'true') {
            document.addEventListener('click', (e) => {
                const target = e.target.closest('a, button');
                if (!target) return;
                
                const href = target.getAttribute('href') || '';
                const onclick = target.getAttribute('onclick') || '';
                
                const isRestrictedPath = href.includes('guardian_profile') || 
                                         href.includes('signaler_un_disparu') || 
                                         href.includes('signaler_un_enfant_trouv') || 
                                         href.includes('v2_smart_device') || 
                                         href.includes('ai_smart_matching') ||
                                         onclick.includes('guardian_profile') || 
                                         onclick.includes('signaler_un_disparu') || 
                                         onclick.includes('signaler_un_enfant_trouv') || 
                                         onclick.includes('v2_smart_device') ||
                                         onclick.includes('ai_smart_matching');
                
                if (isRestrictedPath) {
                    e.preventDefault();
                    e.stopPropagation();
                    showGuestRestrictionAlert();
                }
            }, true);
        }
    </script>
