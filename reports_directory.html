<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="stylesheet" href="./ui-polish.css"/>
    <title>Child Safety - Reports</title>

                        "surface-container-highest": "#E2E8F0",
                        "primary-fixed": "#e5deff",
                        "secondary": "#64748B",
                        "on-surface": "#0F172A",
                        "inverse-surface": "#1E293B",
                        "surface-dim": "#F1F5F9",
                        "secondary-fixed-dim": "#CBD5E1",
                        "error-container": "#FEF2F2",
                        "on-primary-container": "#532ce6",
                        "on-secondary-fixed-variant": "#475569",
                        "on-background": "#0F172A",
                        "tertiary": "#8f3e00",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#E2E8F0",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#4321c4",
                        "on-primary-fixed": "#1e0b75",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#F1F5F9",
                        "tertiary-container": "#b55100",
                        "primary-container": "#F5F3FF",
                        "primary-fixed-dim": "#c8bfff",
                        "surface-tint": "#532ce6",
                        "secondary-container": "#F1F5F9",
                        "surface-variant": "#F1F5F9",
                        "outline": "#CBD5E1",
                        "tertiary-fixed-dim": "#ffb68e",
                        "outline-variant": "#E2E8F0",
                        "on-secondary-container": "#475569",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#773300",
                        "background": "#EDF0F5",
                        "primary": "#532ce6",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#ffefe9",
                        "on-secondary-fixed": "#0F172A",
                        "error": "#DC2626",
                        "inverse-primary": "#c8bfff",
                        "on-surface-variant": "#64748B",
                        "on-error-container": "#991B1B",
                        "surface-container-low": "#EDF0F5",
                        "surface": "#ffffff",
                        "tertiary-fixed": "#ffdbca",
                        "emergency": "#DC2626",

                    },

                        "xl": "32px",

                    },

                        "label-sm": ["Inter", "sans-serif"],

                        "label-bold": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>

</head>
<body class="bg-background text-on-background font-body-lg antialiased pb-[100px] md:pb-0">

<!-- Main Content Area -->
<main class="pt-2 md:pt-6 md:ml-64 px-container-margin max-w-4xl mx-auto space-y-6 pb-24">

    <!-- Mobile App Bar Card -->
    <section class="profile-header-card p-4 flex items-center justify-between md:hidden">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">assignment</span>
            </div>
            <div class="flex flex-col">
                <span class="text-xs text-on-surface-variant font-medium leading-none mb-0.5">Base de données</span>
                <h2 class="text-lg font-bold text-on-surface leading-tight">Signalements</h2>
            </div>
        </div>
        <button onclick="window.location.href='./alert_center.html'" class="relative text-on-surface-variant p-2 rounded-full hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[24px]">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
        </button>
    </section>

    <!-- Desktop Title (Hidden on mobile) -->
    <div class="hidden md:flex justify-between items-center pb-2 border-b border-outline-variant/20">
        <div>
            <h1 class="text-2xl font-bold text-on-surface">Base de données des signalements</h1>
            <p class="text-sm text-on-surface-variant mt-0.5">Consultez et suivez l'état des recherches en temps réel.</p>
        </div>
        <button class="bg-primary text-white font-bold py-2.5 px-5 rounded-xl hover:bg-primary/95 transition-all flex items-center gap-2 shadow-sm text-sm" onclick="window.location.href='./signaler_un_disparu_tape_1.html'">
            <span class="material-symbols-outlined text-sm">add</span>
            Signaler un disparu
        </button>
    </div>

    <!-- View Selection Tabs -->
    <div class="flex bg-[#F1F5F9] p-1 rounded-full max-w-md mx-auto border border-[#EAECF0]">
        <button class="flex-1 bg-white text-[#0F172A] font-bold py-2.5 rounded-full shadow-sm text-center text-sm transition-all active:scale-98" onclick="window.location.href='./reports_directory.html'">
            Disparus
        </button>
        <button class="flex-1 text-[#64748B] font-semibold py-2.5 rounded-full text-center text-sm hover:text-[#0F172A] transition-all active:scale-98" onclick="window.location.href='./found_reports_directory.html'">
            Trouvés
        </button>
    </div>

    <!-- Search Bar -->
    <div class="flex items-center gap-3 max-w-3xl mx-auto">
        <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#94A3B8]" style="font-variation-settings: 'FILL' 0;">search</span>
            <input id="searchInput" class="w-full bg-white border border-[#EAECF0] rounded-2xl py-3 pl-12 pr-4 focus:outline-none focus:border-[#532CE6] focus:ring-2 focus:ring-[#532CE6]/10 transition-all text-sm placeholder-[#94A3B8] text-[#0F172A]" placeholder="Rechercher un signalement..." type="text"/>
        </div>
        <button id="btnFilter" class="bg-white border border-[#EAECF0] rounded-2xl w-12 h-12 flex items-center justify-center text-[#64748B] hover:text-[#0F172A] hover:bg-[#F8F9FA] transition-colors shadow-sm shrink-0">
            <span class="material-symbols-outlined text-[20px] text-[#532CE6]" style="font-variation-settings: 'FILL' 0;">tune</span>
        </button>
    </div>

    <!-- Redesigned Report Cards List -->
    <div id="cardsContainer" class="space-y-4 max-w-3xl mx-auto">
        <!-- Dynamically Rendered -->
    </div>

    <script type="module">
        import { reportService } from './src/reportService.js';

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cardsContainer');
            const searchInput = document.getElementById('searchInput');

            function renderReports(reports) {
                if (reports.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white rounded-2xl p-8 text-center border border-[#EAECF0] shadow-sm max-w-3xl mx-auto">
                            <span class="material-symbols-outlined text-[#94A3B8] text-[48px] mb-2">search_off</span>
                            <p class="text-[#64748B] font-medium">Aucun signalement trouvé</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = reports.map(report => {
                    const labelAge = report.age ? `, ${report.age} ans` : '';
                    let badgeClass = 'bg-[#F5F3FF] text-[#532CE6] border border-[#532CE6]/20';
                    let badgeLabel = 'Recherche';

                    if (report.status === 'Urgent') {
                        badgeClass = 'bg-[#FEF2F2] text-[#DC2626] border border-[#FECACA]';
                        badgeLabel = 'Urgent';
                    } else if (report.status === 'Published' || report.status === 'Retrouvé') {
                        badgeClass = 'bg-[#F0FDF4] text-[#166534] border border-[#BBF7D0]';
                        badgeLabel = report.status === 'Retrouvé' ? 'Retrouvé' : 'Publié';
                    }

                    const genderLabel = (report.gender || "").toLowerCase() === 'fille' ? 'Fille' : 'Garçon';

                    return `
                        <div class="report-card bg-white rounded-2xl p-4 flex gap-4 items-center border border-[#EAECF0] shadow-sm hover:shadow-md hover:border-[#532CE6]/30 hover:-translate-y-0.5 transition-all duration-300 relative cursor-pointer" 
                             data-id="${report.id}">
                            <div class="w-24 h-28 rounded-xl border border-[#EAECF0] p-1 flex-shrink-0 relative bg-[#F8F9FA]">
                                <div class="w-full h-full rounded-lg overflow-hidden bg-[#F1F5F9]">
                                    <img alt="${report.name}" class="w-full h-full object-cover object-center" src="${report.photo || '/assets/children/child-01.webp'}" onerror="this.onerror=null; this.src='/assets/children/child-01.webp';" />
                                </div>
                            </div>
                            <div class="flex-1 min-w-0 py-0.5 flex flex-col justify-between h-28">
                                <div>
                                    <div class="flex items-center justify-between gap-2 mb-1.5">
                                        <h3 class="font-bold text-[17px] text-[#0F172A] leading-tight tracking-tight truncate">${report.name}${labelAge}</h3>
                                        <span class="${badgeClass} text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shrink-0">${badgeLabel}</span>
                                    </div>
                                    <p class="text-xs text-[#64748B] flex items-center gap-1 mb-1">
                                        <span class="material-symbols-outlined text-[15px] text-[#532CE6]" style="font-variation-settings: 'FILL' 1;">location_on</span>
                                        ${report.location}
                                    </p>
                                    <p class="text-[11px] text-[#94A3B8] flex items-center gap-1">
                                        <span class="material-symbols-outlined text-[14px]">schedule</span>
                                        ${report.date} • ${report.time || '12:00'}
                                    </p>
                                </div>
                                <div class="flex items-center gap-2 mt-auto w-full overflow-hidden flex-nowrap">
                                    <span class="text-[10.5px] text-[#532CE6] font-bold bg-[#F5F3FF] border border-[#532CE6]/15 rounded-md px-2 py-0.5 whitespace-nowrap shrink-0">${genderLabel}</span>
                                    <span class="text-[10.5px] text-[#532CE6] font-bold bg-[#F5F3FF] border border-[#532CE6]/15 rounded-md px-2 py-0.5 whitespace-nowrap shrink-0">${report.height || '1m20'}</span>
                                    <span class="bg-[#F8F9FA] text-[#64748B] border border-[#EAECF0] text-[10px] font-semibold px-2 py-0.5 rounded-md flex items-center gap-1 whitespace-nowrap shrink-0 ml-auto">
                                        <span class="material-symbols-outlined text-[13px] text-[#532CE6]" style="font-variation-settings: 'FILL' 1;">my_location</span>
                                        Proche
                                    </span>
                                </div>
                            </div>
                            <span class="material-symbols-outlined text-[#94A3B8] mr-1" style="font-variation-settings: 'FILL' 0;">chevron_right</span>
                        </div>
                    `;
                }).join('');

                // Bind click listeners
                container.querySelectorAll('.report-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.getAttribute('data-id');
                        const report = reportService.getReportById(id);
                        if (report) {
                            sessionStorage.setItem('current_view_report', JSON.stringify(report));
                            window.location.href = './report_details.html';
                        }
                    });
                });
            }

            // Initial fetch of missing reports
            function refreshMissing() {
                const query = searchInput ? searchInput.value : '';
                if (query) {
                    const filtered = reportService.searchReports(query, false);
                    renderReports(filtered);
                } else {
                    const missingReports = reportService.getMissingReports();
                    renderReports(missingReports);
                }
            }

            refreshMissing();

            // Real-time search handler
            searchInput?.addEventListener('input', (e) => {
                refreshMissing();
            });

            window.addEventListener('raydar:reports-synced', refreshMissing);
            window.addEventListener('storage', refreshMissing);
        });
    </script>

    <!-- Floating Action Button (Mobile Only) -->
    <button class="fixed bottom-24 right-6 md:hidden w-14 h-14 bg-gradient-to-br from-primary to-primary-container rounded-full shadow-[0px_12px_32px_rgba(83,44,230,0.3)] flex items-center justify-center text-white hover:scale-105 transition-transform z-45 border border-white/10" onclick="window.location.href='./signaler_un_disparu_tape_1.html'">
        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">add_location</span>
    </button>

</main>

<script>
    // Guest restriction check
    function showGuestRestrictionAlert() {
        if (document.getElementById('guest-restriction-modal')) return;
        
        const modal = document.createElement('div');
        modal.id = 'guest-restriction-modal';
        modal.className = 'fixed inset-0 z-[100] flex items-center justify-center p-md bg-black/60 backdrop-blur-sm transition-all duration-300';
        modal.innerHTML = `
            <div class="bg-surface-container-lowest rounded-2xl p-lg max-w-sm w-full shadow-2xl border border-primary/10 text-center transform scale-95 transition-transform duration-300">
                <div class="w-16 h-16 bg-primary-container/10 text-primary rounded-full flex items-center justify-center mx-auto mb-md">
                    <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Accès Restreint</h3>
                <p class="font-body-md text-body-md text-on-surface-variant mb-lg leading-relaxed text-center">
                    Veuillez créer un compte ou vous connecter pour continuer.
                </p>
                <div class="flex flex-col gap-sm">
                    <a href="./sign_up_child_safety.html" class="w-full h-14 inline-flex items-center justify-center bg-primary text-on-primary rounded-full font-bold text-[17px] shadow-[0_8px_25px_rgba(108,77,255,0.35)] hover:shadow-[0_12px_32px_rgba(108,77,255,0.48)] hover:scale-[1.01] active:scale-[0.98] transition-all duration-200 text-center tracking-wide">
                        <span class="material-symbols-outlined mr-2 text-[22px]">person_add</span>
                        <span>Créer un compte</span>
                    </a>
                    <a href="./login_child_safety.html" class="w-full py-3 border-2 border-primary text-primary hover:bg-primary/10 rounded-full font-label-bold text-label-bold active:scale-95 transition-all block text-center shadow-sm">
                        Se connecter
                    </a>
                    <button id="closeGuestModal" class="w-full py-2.5 text-on-surface-variant hover:bg-surface-container-high rounded-full font-label-bold text-label-bold active:scale-95 transition-all">
                        Plus tard
                    </button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        setTimeout(() => {
            modal.querySelector('.transform').classList.remove('scale-95');
        }, 10);

        document.getElementById('closeGuestModal').addEventListener('click', () => {
            modal.querySelector('.transform').classList.add('scale-95');
            modal.style.opacity = '0';
            setTimeout(() => modal.remove(), 200);
        });
    }

    if (localStorage.getItem('is_guest') === 'true') {
        document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button');
            if (!target) return;
            
            const href = target.getAttribute('href') || '';
            const onclick = target.getAttribute('onclick') || '';
            
            const isRestrictedPath = href.includes('guardian_profile') || 
                                     href.includes('signaler_un_disparu') || 
                                     href.includes('signaler_un_enfant_trouv') || 
                                     href.includes('v2_smart_device') || 
                                     onclick.includes('guardian_profile') || 
                                     onclick.includes('signaler_un_disparu') || 
                                     onclick.includes('signaler_un_enfant_trouv') || 
                                     onclick.includes('v2_smart_device');
            
            if (isRestrictedPath) {
                e.preventDefault();
                e.stopPropagation();
                showGuestRestrictionAlert();
            }
        }, true);
    }
</script>


<script src="./src/responsiveShell.js" type="module"></script>
</body>
</html>
